name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 1604 }}
          script: |
            set -e

            DEPLOY_ENV="/srv/docker/todolist/.env"

            read_dotenv() {
              grep "^$1=" "$DEPLOY_ENV" | head -1 | cut -d= -f2- | sed -e "s/^['\"]//" -e "s/['\"]$//"
            }

            echo "▶ Pull du code"
            cd /srv/docker/todolist/source
            git pull origin main

            echo "▶ Migration Prisma (non bloquante)"
            DB_URL="$(read_dotenv DATABASE_URL)"
            if [ -n "$DB_URL" ]; then
              docker run --rm \
                --network host \
                -e DATABASE_URL="$DB_URL" \
                -v /srv/docker/todolist/source:/app \
                -w /app \
                node:22-bookworm-slim \
                sh -c "apt-get update -qq && apt-get install -y -qq openssl ca-certificates >/dev/null \
                  && corepack enable && corepack prepare pnpm@11.4.0 --activate \
                  && pnpm install --frozen-lockfile --filter @repo/db... \
                  && pnpm --filter @repo/db db:push" \
                || echo "⚠️ db:push échoué — poursuite du déploiement"
            else
              echo "⚠️ DATABASE_URL absent — skip db:push"
            fi

            echo "▶ Build Docker"
            cd /srv/docker/todolist

            export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$(read_dotenv NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)"
            export CLERK_SECRET_KEY="$(read_dotenv CLERK_SECRET_KEY)"
            export DATABASE_URL="$(read_dotenv DATABASE_URL)"
            export JWT_SECRET="$(read_dotenv JWT_SECRET)"

            if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
              echo "❌ NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY vide ou absent dans $DEPLOY_ENV"
              echo "   Ajoutez pk_live_… (guillemets simples si la clé finit par \$) puis relancez le workflow."
              exit 1
            fi
            echo "Clerk PK: ${#NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY} caractères"

            docker compose --env-file .env build \
              --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
            docker compose --env-file .env up -d

            echo "▶ Sanity check"
            sleep 5
            curl -sf -o /dev/null http://127.0.0.1:3000 && echo "✅ App OK" || echo "⚠️ App non joignable"
