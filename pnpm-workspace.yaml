packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  "@prisma/client": true
  "@prisma/engines": true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
overrides:
  "@prisma/client": "^7.8.0"
  # @expo/log-box (SDK 57) référence encore dom-webview 55.x par erreur.
  "@expo/dom-webview": "57.0.1"
catalog:
  "@trpc/client": ^11.18.0
  "@trpc/react-query": ^11.18.0
  "@trpc/server": ^11.18.0
